<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>OnlyFans</title>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root{
      --purple-main:#a855f7;
      --purple-light:#d8b4fe;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Inter',sans-serif;

      height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      overflow:hidden;

      background:
        radial-gradient(circle at top, rgba(168,85,247,0.16), transparent 40%),
        linear-gradient(135deg,#09090f 0%,#14111d 100%);

    }

    .card{

      position:relative;

      overflow:hidden;

      background:rgba(25,25,35,0.72);

      backdrop-filter:blur(14px);

      border:1px solid rgba(168,85,247,0.25);

      border-radius:28px;

      padding:50px;

      box-shadow:
        0 0 35px rgba(168,85,247,0.12);

    }

    .card::before{

      content:"";

      position:absolute;

      inset:0;

      background:
        linear-gradient(
          120deg,
          transparent,
          rgba(255,255,255,0.03),
          transparent
        );

      transform:translateX(-100%);

      animation:shimmer 7s infinite;
    }

    @keyframes shimmer{
      100%{
        transform:translateX(100%);
      }
    }

    button{

      background:
        linear-gradient(
          135deg,
          rgba(168,85,247,0.95),
          rgba(139,92,246,0.95)
        );

      border:none;

      color:white;

      font-size:1.4rem;
      font-weight:700;

      padding:18px 50px;

      border-radius:18px;

      cursor:pointer;

      transition:all 0.3s ease;

      box-shadow:
        0 0 25px rgba(168,85,247,0.35);

    }

    button:hover{

      transform:
        translateY(-3px)
        scale(1.04);

      box-shadow:
        0 0 40px rgba(168,85,247,0.5);

    }

  </style>
</head>

<body>

  <div class="card">

    <button onclick="rickroll()">
      OnlyFans
    </button>

  </div>

  <script>

    function rickroll(){

      window.location.href =
        'https://www.youtube.com/watch?v=dQw4w9WgXcQ';

    }

  </script>

</body>
</html>
